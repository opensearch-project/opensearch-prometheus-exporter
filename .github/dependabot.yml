version: 2
updates:
  # GitHub Actions: minor and patch updates are grouped into one PR per branch,
  # major updates still get their own PR so a breaking change cannot block the rest.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: v2.19
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: v3.6
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: v2.19
    schedule:
      interval: "weekly"
    ignore:
      # OpenSearch 2.19 build-tools work up to Gradle 8.13 but fail on Gradle 8.14+
      # (see #709, #719) and on Gradle 9 (see #657), so v2.19 stays below 8.14.
      - dependency-name: "gradle-wrapper"
        versions: [">= 8.14"]
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: v3.6
    schedule:
      interval: "weekly"
