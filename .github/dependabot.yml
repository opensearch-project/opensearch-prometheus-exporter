version: 2
updates:
  # GitHub Actions: minor and patch updates are grouped into one PR per branch,
  # major updates still get their own PR so a breaking change cannot block the rest.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: v2.19
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: v3.6
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: v2.19
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: v3.6
    schedule:
      interval: "weekly"
