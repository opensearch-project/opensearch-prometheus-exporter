# Test external refresh stats (node and index level) and node level translog and warmer stats.
---
"External refresh, node level translog and warmer statistics":

  - do:
      indices.create:
        index: twitter
        body:
          settings:
            index:
              number_of_shards: 1
              number_of_replicas: 0
              refresh_interval: -1

  - do:
      index:
        index: twitter
        id: 1
        body: { foo: bar }

  # An explicit refresh is an external refresh
  - do:
      indices.refresh:
        index: twitter

  - do:
      prometheus.metrics: {}

  # Index level external refreshes, at least the explicit refresh above
  - match:
      $body: |
        /.*
        \# \s HELP \s opensearch_index_refresh_external_total_count (\s|\w|\d)+ \n
        \# \s TYPE \s opensearch_index_refresh_external_total_count \s gauge \n
        (
          opensearch_index_refresh_external_total_count\{
              cluster="yamlRestTest",index="twitter",context="(primaries|total)"
          ,\} \s+ [1-9]\d*\.\d+ \n?
        ){2}
        .*/

  - match:
      $body: |
        /.*
        \# \s HELP \s opensearch_index_refresh_external_total_time_seconds (\s|\w|\d)+ \n
        \# \s TYPE \s opensearch_index_refresh_external_total_time_seconds \s gauge \n
        (
          opensearch_index_refresh_external_total_time_seconds\{
              cluster="yamlRestTest",index="twitter",context="(primaries|total)"
          ,\} \s+ \d+\.\d+(E-?\d+)? \n?
        ){2}
        .*/

  # Node level external refreshes
  - match:
      $body: |
        /.*
        opensearch_indices_refresh_external_total_count\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+ \n?
        .*/

  - match:
      $body: |
        /.*
        opensearch_indices_refresh_external_total_time_seconds\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+(E-?\d+)? \n?
        .*/

  # Node level translog
  - match:
      $body: |
        /.*
        opensearch_indices_translog_operations_number\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+ \n?
        .*/

  - match:
      $body: |
        /.*
        opensearch_indices_translog_size_bytes\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+(E\d+)? \n?
        .*/

  - match:
      $body: |
        /.*
        opensearch_indices_translog_uncommitted_operations_number\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+ \n?
        .*/

  - match:
      $body: |
        /.*
        opensearch_indices_translog_uncommitted_size_bytes\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+(E\d+)? \n?
        .*/

  # Node level warmer
  - match:
      $body: |
        /.*
        opensearch_indices_warmer_count\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+ \n?
        .*/

  - match:
      $body: |
        /.*
        opensearch_indices_warmer_current_number\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+ \n?
        .*/

  - match:
      $body: |
        /.*
        opensearch_indices_warmer_time_seconds\{
            cluster="yamlRestTest",node="[^"]+",nodeid="[^"]+",
        \} \s+ \d+\.\d+(E-?\d+)? \n?
        .*/

  # Test clean up...
  - do:
      indices.delete:
        index: twitter
